# ---------------------------------------------------------------
# Trend dashboard settings. Edit this file in GitHub to customize.
# Indent with spaces only. Each list item starts with "- ".
# Keywords automatically match plurals (supplement = supplements).
# ---------------------------------------------------------------

# Your Reddit username (no "u/"). Reddit asks apps to identify who runs them.
reddit_username: ""

# Leave false. Reddit's rules only allow automated access through its API,
# so the Reddit section stays off until you add API keys (see README).
reddit_allow_without_login: false

# Relevance filter: Claude scores each trend lead 0-10 (see `leads` / `scores` in briefing.py).
# Items rated below min_score are hidden. No local model or key needed.
scoring:
  min_score: 6
  publications: Verywell Health, Verywell Mind, Verywell Fit, Health.com, and Prevention

# Repeats: hide anything already shown in an earlier report. If fewer than
# min_new_items new headlines are left, run extra searches (starting with
# today's rising topics, then a rotating slice of the topic keywords).
repeats:
  hide_repeats: true
  min_new_items: 12
  max_extra_searches: 12

# Outputs: everything goes into one page, docs/index.html.
outputs:
  markdown: false   # true also writes reports/briefing-*.md

